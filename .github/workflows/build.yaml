name: Build

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev", "main" ]

defaults:
  run:
    shell: bash

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'CISkip') }}
    strategy:
      matrix:
       os: [ubuntu-24.04, windows-2025, macos-26-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          submodules: recursive
          ref: dev
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0'
      
      - name: Build .NET Projects
        run: |
          dotnet build RetroMole.sln 

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.os }}
          path: ./src/RetroMole.Launch/bin/Debug/net8.0/
          retention-days: 30
